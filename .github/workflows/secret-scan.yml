name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid org license; the gitleaks
      # binary itself is MIT-licensed and free. Install and run directly.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          cd /tmp
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1
