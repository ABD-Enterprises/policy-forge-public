name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    # LINUX_RUNNER_LABELS is an org variable holding a JSON array of self-hosted runner labels.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid org license; the gitleaks binary
      # itself is MIT-licensed and free. Install the release binary for the
      # runner's architecture into a job-scoped directory (no root needed),
      # verify its published checksum, and run it directly.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          case "$(uname -m)" in
            x86_64) GITLEAKS_ARCH=x64 ;;
            aarch64|arm64) GITLEAKS_ARCH=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_${GITLEAKS_ARCH}.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          INSTALL_DIR="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${INSTALL_DIR}"
          cd "${INSTALL_DIR}"
          curl -sSfL -O "${BASE_URL}/${ASSET}"
          curl -sSfL -O "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ASSET}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1
