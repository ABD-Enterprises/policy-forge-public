name: Link check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede an in-flight pull-request run; never cancel a push-to-main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  link-check:
    # LINUX_RUNNER_LABELS is an org variable holding a JSON array of self-hosted runner labels.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 8 successful runs: at most 0.2 min of running time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # lycheeverse/lychee-action is not an allowed action (see markdown-lint.yml), so
      # install the release binary for the runner's architecture into a job-scoped
      # directory (no root needed) and verify its published checksum.
      - name: Install lychee
        run: |
          LYCHEE_TAG=lychee-v0.24.2
          case "$(uname -m)" in
            x86_64) LYCHEE_ARCH=x86_64 ;;
            aarch64|arm64) LYCHEE_ARCH=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ARCHIVE="lychee-${LYCHEE_ARCH}-unknown-linux-gnu"
          ASSET="${ARCHIVE}.tar.gz"
          BASE_URL="https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_TAG}"
          INSTALL_DIR="${RUNNER_TEMP}/lychee"
          mkdir -p "${INSTALL_DIR}"
          cd "${INSTALL_DIR}"
          curl -sSfL -O "${BASE_URL}/${ASSET}"
          curl -sSfL -O "${BASE_URL}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          tar -xzf "${ASSET}"
          echo "${INSTALL_DIR}/${ARCHIVE}" >> "$GITHUB_PATH"
          "${INSTALL_DIR}/${ARCHIVE}/lychee" --version

      - name: Check links
        run: lychee --verbose --no-progress "**/*.md"
