name: Markdown lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per pull request, so a new push supersedes
  # the one in flight. Every other run is keyed by its run id: GitHub keeps at
  # most one pending run per group, so sharing a group would drop a queued
  # push-to-main run even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-lint:
    # LINUX_RUNNER_LABELS is an org variable holding a JSON array of self-hosted runner labels.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 8 successful runs: at most 0.3 min of running time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The self-hosted Linux runners do not ship Node; setup-node installs it
      # into the runner's tool cache without root.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The org only allows GitHub-owned actions, verified creators and ABD-Enterprises/*;
      # DavidAnson/markdownlint-cli2-action is none of those, so the job could not even start.
      # Run the same markdownlint-cli2 release the action v16.0.0 wraps, directly.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md"
