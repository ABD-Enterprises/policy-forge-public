name: Local macOS smoke

on:
  workflow_dispatch:

jobs:
  local-macos-smoke:
    permissions:
      contents: read
    # MACOS_RUNNER_LABELS is an org variable holding a JSON array of self-hosted
    # macOS build/test runner labels. This job only reads the tree; it never signs.
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER_LABELS) }}
    # No recorded run (manual workflow, currently disabled); the job only counts files.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          markdown_files = sorted(Path(".").rglob("*.md"))
          workflow_files = sorted(Path(".github/workflows").glob("*.yml"))

          print(f"markdown_files={len(markdown_files)}")
          print(f"workflow_files={len(workflow_files)}")

          assert markdown_files, "expected at least one markdown file"
          assert workflow_files, "expected at least one workflow file"
          PY
